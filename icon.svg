<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D83142"/>
      <stop offset="1" stop-color="#A70C15"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- "C" als Ring mit Öffnung rechts -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-width="56"
          stroke-linecap="round" stroke-dasharray="604 150"
          transform="rotate(35.8 256 256)"/>
  <!-- Amber-Punkt in der Öffnung (Anlehnung ans Curacon-Emblem) -->
